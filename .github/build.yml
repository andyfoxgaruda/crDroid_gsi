name: Build crDroid 12.7 GSI
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Environment
        run: |
          sudo apt update && sudo apt install -y repo git-lfs bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf libxml2 libxml2-utils lzop rsync schedtool squashfs-tools
      - name: Repo Init & Sync (Android 16)
        run: |
          repo init -u https://github.com/crdroidandroid/android.git -b 16.0 --depth=1
          git clone https://github.com/naz664/treble_manifest.git .repo/local_manifests -b 16
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      - name: Patch & Generate
        run: |
          cd device/phh/treble
          bash generate.sh crDroid
      - name: Build GSI
        run: |
          . build/envsetup.sh
          lunch treble_arm64_bgN-userdebug
          make systemimage -j$(nproc --all)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-12.7-GSI
          path: out/target/product/phh_treble_arm64/system.img
